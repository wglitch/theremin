<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>Visual Theremin</title>
  <link rel="icon" type="image/png" href="thereminicon2.png">
  <link rel="apple-touch-icon" href="thereminicon2.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
</head>

<body>
  <main class="instrument-shell">
    <header class="brand-strip">
      <div>
        <p class="eyebrow">Stereo optical instrument</p>
        <h1>Visual Theremin</h1>
      </div>
      <img class="app-icon" src="thereminicon2.png" alt="">
    </header>

    <section class="panel">
      <div class="scope-frame" id="canvasContainer">
        <video id="input_video" playsinline muted></video>
        <canvas id="output_canvas"></canvas>
      </div>

      <div class="meter-bank" aria-live="polite">
        <div class="readout readout-left">
          <span>VOICE A / Oo</span>
          <strong id="leftPitchDisplay">0 Hz</strong>
          <em id="leftVolumeDisplay">0%</em>
        </div>
        <div class="readout readout-right">
          <span>VOICE B / Aa</span>
          <strong id="rightPitchDisplay">0 Hz</strong>
          <em id="rightVolumeDisplay">0%</em>
        </div>
      </div>

      <button id="startButton" class="start-button">Start instrument</button>

      <div class="control-deck" id="controls">
        <label>
          <span>Drive A</span>
          <input type="range" id="leftDrive" min="0" max="1" value="0.12" step="0.01">
        </label>
        <label>
          <span>Reverb A</span>
          <input type="range" id="leftReverb" min="0" max="1" value="0.24" step="0.01">
        </label>
        <label>
          <span>Master</span>
          <input type="range" id="masterVolume" min="0" max="1" value="0.65" step="0.01">
        </label>
        <label>
          <span>Reverb B</span>
          <input type="range" id="rightReverb" min="0" max="1" value="0.28" step="0.01">
        </label>
        <label>
          <span>Drive B</span>
          <input type="range" id="rightDrive" min="0" max="1" value="0.1" step="0.01">
        </label>
      </div>
    </section>
  </main>

  <script src="theremin.js"></script>
</body>
</html>
