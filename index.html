<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Theremin</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
  <style>
body {
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  font-family: Arial, sans-serif;
  background: #101820;
  color: #ffffff;
}

h1 {
  margin: 0;
  font-size: 32px;
}

p {
  margin: 0;
}

.container {
  position: relative;
  display: none;
  width: min(100%, 960px);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: #000000;
}

#output_canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#input_video {
  display: none;
}

.controls {
  display: none;
  width: min(100%, 520px);
  padding: 14px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  background-color: rgba(255, 255, 255, 0.08);
  text-align: center;
}

.controls p + p {
  margin-top: 10px;
}

#masterVolume {
  width: min(260px, 100%);
  vertical-align: middle;
}

#startButton {
  padding: 12px 22px;
  border: 0;
  border-radius: 6px;
  background: #ffffff;
  color: #101820;
  font-size: 20px;
  cursor: pointer;
}
  </style>
</head>

<body>
  <h1>AI Theremin</h1>
  <p>Hoger hand: avstand till kameran styr pitch. Vanster hand: oppenhet styr volym.</p>

  <button id="startButton">Starta Theremin</button>

  <div class="container" id="canvasContainer">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls" id="controls">
    <p>Pitch: <span id="pitchDisplay">0 Hz</span></p>
    <p>Volym: <span id="volumeDisplay">0%</span></p>
    <p>Master: <input type="range" id="masterVolume" min="0" max="1" value="0.5" step="0.01"></p>
  </div>

  <script src="theremin.js"></script>
</body>
</html>
